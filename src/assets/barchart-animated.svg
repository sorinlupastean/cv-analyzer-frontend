<svg width="30" height="30" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <rect x="6" y="24" width="6" height="18" rx="2" fill="#4A90E2">
    <animate attributeName="height" from="0" to="18" dur="0.8s" fill="freeze"/>
    <animate attributeName="y" from="42" to="24" dur="0.8s" fill="freeze"/>
  </rect>
  <rect x="16" y="16" width="6" height="26" rx="2" fill="#6FB4FF">
    <animate attributeName="height" from="0" to="26" dur="0.9s" fill="freeze" begin="0.1s"/>
    <animate attributeName="y" from="42" to="16" dur="0.9s" fill="freeze" begin="0.1s"/>
  </rect>
  <rect x="26" y="10" width="6" height="32" rx="2" fill="#3A7EE0">
