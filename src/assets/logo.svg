<svg width="100" height="150" viewBox="0 0 200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <path d="M65 30 H115 L155 70 V150 C155 158.284 148.284 165 140 165 H60 C51.7157 165 45 158.284 45 150 V45 C45 36.7157 51.7157 30 60 30Z" 
          stroke="url(#avatarGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <path d="M65 75 H135" stroke="url(#avatarGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <path d="M65 95 H115" stroke="url(#avatarGrad)" stroke-width="4" stroke-linecap="round" opacity="0.3" />
    <path d="M65 115 H95" stroke="url(#avatarGrad)" stroke-width="4" stroke-linecap="round" opacity="0.2" />

    <circle cx="135" cy="140" r="12" fill="#c5f3fc" opacity="0.95" />
    <path d="M127 140 L133 146 L143 134" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <circle cx="155" cy="50" r="4" fill="#22D3EE">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" />
  </circle>

  <defs>
  <linearGradient id="lightWowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22D3EE" />
    <stop offset="100%" stop-color="#0EA5E9" />
  </linearGradient>

  <filter id="ultraLightGlow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="1.5" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>

<g filter="url(#ultraLightGlow)">
  <text x="100" y="210" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="url(#lightWowGradient)" style="text-transform: uppercase; letter-spacing: 3px;">
    CV ANALYZER
  </text>
  
  <text x="100" y="232" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.4" style="text-transform: uppercase; letter-spacing: 8px;">
    STUDIO
  </text>
</g>
</svg>